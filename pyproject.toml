[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "nfeloqb"
version = "0.2.6"
description = "NFL game score and outcome prediction with a margin/total ML model, calibrated win probabilities, and tooling for Pick 'Em and Confidence Pools."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["stats", "sports", "football", "machine learning"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "nfelodcm>=0.3",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "pandas>=3.1",
    "polars>=2.1",
    "python-dotenv>=1.2",
    "requests>=2.34",
    "scipy>=1.18",
]

[dependency-groups]
dev = [
    "colorama>=0.4",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "ty>=0.0.102",
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-root = ""
module-name = "nfeloqb"
namespace = true

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["."]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear rules
    "C4",  # flake8-comprehensions rules
    "D",   # pydocstyle rules
    "E",   # pycodestyle errors
    "F",   # pyflakes rules
    "I",   # isort rules
    "N",   # pep8-naming rules
    "S",   # bandit security rules
    "SIM", # flake8-simplify rules
    "UP",  # pyupgrade rules
    "W",   # pycodestyle warnings
    "NPY", # numpy docstring rules
    "PGH", # pygrep-hooks rules
]
ignore = [
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.isort]
known-first-party = ["nfeloqb"]
known-third-party = ["__main__"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]                        # Use of assert is standard in pytest
"nfeloqb/Optimizer/ConfigOptimizer.py" = ["D", "N999"]
"nfeloqb/DataModels/GameContext.py" = ["N999"]
"nfeloqb/DataModels/ModelConfig.py" = ["N999"]
"nfeloqb/DataModels/ModelParam.py" = ["N999"]
"nfeloqb/DataModels/QB.py" = ["N999"]
"nfeloqb/DataModels/Team.py" = ["N999"]
"nfeloqb/Resources/airtable_wrapper.py" = ["D"]
"nfeloqb/Resources/data_loader.py" = ["D"]
"nfeloqb/Resources/elo.py" = ["D"]
"nfeloqb/feature_optimization.py" = ["D"]

# --------------------------------------------------------------------------------------------
# Type checking: ty and pyright (strict)
# --------------------------------------------------------------------------------------------
[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"

[tool.ty.src]
# Limit ty to the checked-in source roots we validate in CI.
include = ["nfeloqb", "scripts", "tests"]

# --------------------------------------------------------------------------------------------
# Tests and coverage
# --------------------------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.14"
# Keep pyright on the repo's stable standard-mode baseline, then promote the specific diagnostics we
# rely on in CI and Pylance.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonPlatform = "Linux"
stubPath = "stubs"
executionEnvironments = [{ root = "." }]
# --- Standard-mode diagnostics promoted to errors (also surfaced by Pylance) ----------
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "error"
reportAssignmentType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportMissingTypeStubs = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
strict = true
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=nfeloqb",
    "--cov-report=term-missing",
]
filterwarnings = ["ignore::DeprecationWarning", "error"]

[tool.coverage.run]
branch = true
source = ["nfeloqb"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == \"__main__\":", "if TYPE_CHECKING:"]
