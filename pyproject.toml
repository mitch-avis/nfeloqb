[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[project]
name = "nfeloqb"
version = "0.2.6"
description = "NFL game score and outcome prediction with a margin/total ML model, calibrated win probabilities, and tooling for Pick 'Em and Confidence Pools."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["stats", "sports", "football", "machine learning"]
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "nfelodcm",
    "nflreadpy",
    "numpy",
    "pandas",
    "polars",
    "python-dotenv",
    "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/mitch-avis/nfeloqb"

[dependency-groups]
dev = [
    "colorama",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-metadata",
    "pytest-sugar",
    "pytest-xdist",
    "ruff",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["nfeloqb"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.11.21"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear rules
    "C4",  # flake8-comprehensions rules
    "D",   # pydocstyle rules
    "E",   # pycodestyle errors
    "F",   # pyflakes rules
    "I",   # isort rules
    "N",   # pep8-naming rules
    "S",   # bandit security rules
    "SIM", # flake8-simplify rules
    "UP",  # pyupgrade rules
    "W",   # pycodestyle warnings
    "NPY", # numpy docstring rules
    "PGH", # pygrep-hooks rules
]
ignore = [
    "D203", # Conflicts with D211 (no-blank-line-before-class)
    "D213", # Conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # Use of assert is standard in pytest

[tool.ruff.lint.isort]
known-first-party = ["nfeloqb"]
known-third-party = ["__main__"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"
python-version = "3.14"

[tool.ty.src]
# Limit ty to the checked-in source roots we validate in CI.
include = ["nfeloqb", "scripts", "tests"]

[tool.pyright]
pythonVersion = "3.14"
# Keep pyright on the repo's stable standard-mode baseline, then promote the specific diagnostics we
# rely on in CI and Pylance.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonPlatform = "Linux"
stubPath = "stubs"
executionEnvironments = [{ root = "." }]
# --- Standard-mode diagnostics promoted to errors (also surfaced by Pylance) ----------
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "error"
reportAssignmentType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportMissingTypeStubs = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "--strict-markers",
    "--cov=nfeloqb",
    "--cov-report=term-missing",
]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["nfeloqb"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
